# Damas Vision behind one port (8092): the app, and the local vision service's API on the
# same origin, so the browser needs no cross-origin access and the service port stays private.
server {
    listen 8092;
    server_name _;
    root /usr/share/nginx/html;

    # Frames for the vision service (JPEG) and refinement payloads (base64 PNG): the service
    # itself refuses bodies above 8 MB.
    client_max_body_size 9m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Local vision service API (vision-service, contract v1). Only /v1/ is forwarded.
    location /v1/ {
        proxy_pass http://vision:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # `expires` (not add_header, which would drop the security headers above).
    # The service worker, its manifest and the shell must always be revalidated.
    location = /ngsw-worker.js { expires -1; }
    location = /ngsw.json { expires -1; }
    location = /index.html { expires -1; }
    location = /deployment.json { expires -1; }

    location ~* \.(?:js|css|wasm|png|ico|svg|webmanifest)$ {
        try_files $uri =404;
        expires 1h;
    }

    # Single-page app: unknown paths serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
